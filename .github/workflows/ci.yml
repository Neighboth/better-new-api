name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Cross-build Windows BYOG worker
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o /tmp/byog-worker.exe ./worker/desktop

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  temporary-windows-worker-build:
    if: github.event.action != 'closed' && github.event.pull_request.head.ref == 'arena/fcb68de0-better-new-api'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: arena/fcb68de0-better-new-api
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Build Windows worker and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gofmt -w controller/byog_hf.go controller/byog_hf_test.go controller/byog_observability.go controller/reseller.go controller/reseller_validation_test.go controller/topup_gateway_auth_test.go model/byog_observability.go model/byog_observability_test.go worker/desktop/gui_windows.go worker/desktop/webview_windows.go
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w -H windowsgui' -o 'worker/binaries/BYOG Worker.exe' ./worker/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Worker build failed' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler is unavailable' }
          & $iscc 'worker/installer/byog-worker.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Commit generated Windows binaries to this session branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'worker/binaries/BYOG Worker.exe' 'worker/binaries/BYOG Worker Kurulumu.exe' controller/byog_hf.go controller/byog_hf_test.go controller/byog_observability.go controller/reseller.go controller/reseller_validation_test.go controller/topup_gateway_auth_test.go model/byog_observability.go model/byog_observability_test.go worker/desktop/gui_windows.go worker/desktop/webview_windows.go
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'build: windows istemcisini guncelle'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:arena/fcb68de0-better-new-api
            if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          }
